# Generated from deploy/sites.json — edit that file, then run:
#   node deploy/render_nginx.js
#   ./deploy/deploy.sh
#
# nginx serves the app on port 80 when a site has no domain.
# /api and /files go to backend_port. vLLM stays on its own port.
# HTTPS added automatically when Let's Encrypt certs exist for a domain.
# Do not edit this file by hand.
# (No top-level gzip here — main nginx.conf already enables it.)

# --- bengaluru  API 127.0.0.1:5005 ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /home/ubuntu/blurasaga/frontend/build;
    index index.html;
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /files/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /static/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # Avoid $uri/ → /index.html redirect cycles (common when root is under /home).
        try_files $uri /index.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
